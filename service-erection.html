<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavy Equipment Erection | Prateesh Engineering Enterprises</title>
    <link rel="stylesheet" href="style_new.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .service-page-header { padding: 150px 0 80px; background-color: var(--dark); text-align: center; }
        .service-page-header h1 { font-size: 3rem; color: var(--white); margin-bottom: 20px; }
        .service-page-header p { color: var(--text-muted); font-size: 1.2rem; max-width: 800px; margin: 0 auto; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; padding: 60px 0; background-color: var(--dark-light); }
        .gallery-item { border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
        .gallery-item img { width: 100%; height: 250px; object-fit: cover; transition: var(--transition); }
        .gallery-item:hover img { transform: scale(1.05); }
        .back-btn { display: inline-block; margin-top: 30px; color: var(--primary); text-decoration: none; font-weight: 600; }
        .back-btn:hover { color: var(--white); }
    </style>
</head>
<body>
    <nav class="navbar scrolled">
        <div class="logo"><a href="index.html" class="logo-link"><div class="logo-text"><h1>PRATEESH <span>ENGINEERING ENTERPRISES</span></h1></div></a></div>
        <ul class="nav-links"><li><a href="index.html">Back to Home</a></li></ul>
    </nav>
    <div class="service-page-header">
        <div class="container">
            <h1>Heavy Equipment Erection</h1>
            <p>Our experienced teams handle the safe and efficient erection of massive static and rotary equipment for power plants and refineries.</p>
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Services</a>
        </div>
    </div>
    <div class="gallery-grid-wrapper" style="background-color: var(--dark-light);">
        <div class="container">
            <h2 style="color: var(--white); padding-top: 40px; margin-bottom: 20px; text-align: center;">Project Gallery</h2>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="photos/gallery/erection/heavy-equipment-erection.jpg" alt="Heavy Equipment Erection"></div>
                <div class="gallery-item"><img src="photos/gallery/erection/structural-steel-tower.jpg" alt="Structural Steel Tower"></div>
                <div class="gallery-item"><img src="photos/gallery/erection/chemplast-sanmar-plant.jpg" alt="Chemplast Sanmar Plant"></div>
                <div class="gallery-item"><img src="photos/gallery/erection/industrial-equipment.jpg" alt="Industrial Equipment"></div>
                <div class="gallery-item"><img src="photos/gallery/erection/site-work-01.jpg" alt="Site Work 1"></div>
                <div class="gallery-item"><img src="photos/gallery/erection/site-work-02.jpg" alt="Site Work 2"></div>
                <div class="gallery-item"><img src="photos/gallery/erection/equipment-maintenance.jpg" alt="Equipment Maintenance"></div>
                <div class="gallery-item"><img src="photos/gallery/erection/mechanical-stress-analysis.png" alt="Mechanical Stress Analysis"></div>
            </div>
        </div>
    </div>
</body>
</html>
